<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="256" rx="112" ry="112" fill="url(#shine)"/>
  <!-- Letter T - bold, rounded, modern -->
  <!-- Horizontal bar -->
  <rect x="88" y="108" width="336" height="68" rx="34" fill="white"/>
  <!-- Vertical bar -->
  <rect x="222" y="108" width="68" height="300" rx="34" fill="white"/>
  <!-- Tiny sparkle dots for personality -->
  <circle cx="404" cy="104" r="10" fill="rgba(255,255,255,0.5)"/>
  <circle cx="430" cy="82" r="6" fill="rgba(255,255,255,0.35)"/>
  <circle cx="86" cy="420" r="7" fill="rgba(255,255,255,0.3)"/>
</svg>
